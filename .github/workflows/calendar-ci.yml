name: BRAN Curation Calendar CI/CD

on:
  schedule:
    # Dispara todo dia 1º de cada mês às 12:00 UTC (09:00 BRT)
    - cron: '0 12 1 * *'
  workflow_dispatch:
    inputs:
      target_year:
        description: 'Ano de referência (ex: 2026, deixe vazio para ano atual)'
        required: false
        type: string
      target_month:
        description: 'Mês de referência (1 a 12, deixe vazio para mês atual)'
        required: false
        type: string
      dry_run:
        description: 'Simulação sem criar issues reais (Dry run)'
        required: false
        type: boolean
        default: false
  push:
    paths:
      - 'curation-schedule.yml'
      - 'scripts/**'
      - '.github/workflows/calendar-ci.yml'

jobs:
  sync-calendar:
    name: Sincronizar calendar.ics e SVGs (12 Meses + Current)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar PyYAML
        run: pip install pyyaml

      - name: Gerar calendar.ics e SVGs
        run: |
          python3 scripts/generate_calendar.py
          ARGS="--all-months"
          if [ -n "${{ inputs.target_year }}" ]; then
            ARGS="$ARGS --year ${{ inputs.target_year }}"
          fi
          if [ -n "${{ inputs.target_month }}" ]; then
            ARGS="$ARGS --month ${{ inputs.target_month }}"
          fi
          python3 scripts/generate_status_svg.py $ARGS

      - name: Comitar alterações se houver
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add calendar.ics assets/
          if git diff --staged --quiet; then
            echo "Calendário e assets já estão atualizados. Nenhuma mudança para comitar."
          else
            git commit -m "chore(calendar): sincronizar calendar.ics e SVGs dos 12 meses"
            git push
          fi

  notify-tasks:
    name: Verificar Tarefas e Criar Issues
    needs: sync-calendar
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar PyYAML
        run: pip install pyyaml

      - name: Executar verificação e criação de issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          EXTRA_ARGS=""
          if [ -n "${{ inputs.target_year }}" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --year ${{ inputs.target_year }}"
          fi
          if [ -n "${{ inputs.target_month }}" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --month ${{ inputs.target_month }}"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --dry-run"
          fi
          python3 scripts/notify_curation_tasks.py $EXTRA_ARGS
